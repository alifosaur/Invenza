version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: invenza-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: invenza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invenza"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: invenza-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/invenza
      - SECRET_KEY=change-this-to-a-random-secret-key-in-production
      - ALGORITHM=HS256
      - APP_ENV=development
      - FRONTEND_URL=http://localhost:5174
      # Add SMTP settings here if needed
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # For production, you might pass args for VITE_API_URL if needed
    container_name: invenza-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:
